<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referenzen – KMU Digitalisieren</title>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="referenzen.css?v=2">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cabin Condensed', sans-serif;
            background: #ffffff;
            color: #000;
            padding: 40px 20px;
        }
    </style>
</head>
<body>

<script>
// Cache-Busting: Timestamp anhängen damit keine alte Version geladen wird
fetch('referenzen.html?v=' + Date.now())
  .then(function(r) { return r.text(); })
  .then(function(html) {
    document.body.insertAdjacentHTML('beforeend', html);
    var s = document.createElement('script');
    s.src = 'referenzen.js?v=' + Date.now();
    document.body.appendChild(s);
  });
</script>

</body>
</html>
